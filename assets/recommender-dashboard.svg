<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Explainable recommender fairness dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      .title{font:800 28px Arial,Helvetica,sans-serif;fill:#0f172a}
      .h{font:800 19px Arial,Helvetica,sans-serif;fill:#0f172a}
      .t{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}
      .n{font:800 32px Arial,Helvetica,sans-serif;fill:#111827}
      .s{font:700 12px Arial,Helvetica,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1100" height="560" rx="28" fill="url(#bg)"/>
  <text class="title" x="550" y="48" text-anchor="middle">Explainable Recommender Fairness Dashboard</text>
  <g filter="url(#shadow)">
    <rect x="55" y="82" width="220" height="120" rx="22" fill="#ffffff"/>
    <text class="s" x="84" y="118">RELEVANCE@10</text><text class="n" x="84" y="158">0.74</text><text class="t" x="84" y="184">hybrid reranker</text>
    <rect x="310" y="82" width="220" height="120" rx="22" fill="#ffffff"/>
    <text class="s" x="339" y="118">EXPOSURE GAP</text><text class="n" x="339" y="158">0.11</text><text class="t" x="339" y="184">provider fairness audit</text>
    <rect x="565" y="82" width="220" height="120" rx="22" fill="#ffffff"/>
    <text class="s" x="594" y="118">DIVERSITY SCORE</text><text class="n" x="594" y="158">0.68</text><text class="t" x="594" y="184">category/provider mix</text>
    <rect x="820" y="82" width="220" height="120" rx="22" fill="#ffffff"/>
    <text class="s" x="849" y="118">EXPLANATION COVERAGE</text><text class="n" x="849" y="158">96%</text><text class="t" x="849" y="184">recommendations with reasons</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="55" y="240" width="470" height="250" rx="24" fill="#fff"/>
    <text class="h" x="84" y="278">Algorithm comparison</text>
    <g transform="translate(90 315)">
      <text class="t" x="0" y="0">Popularity</text><rect x="150" y="-14" width="245" height="20" rx="10" fill="#fecdd3"/><rect x="150" y="-14" width="198" height="20" rx="10" fill="#e11d48"/>
      <text class="t" x="0" y="45">Content-based</text><rect x="150" y="31" width="245" height="20" rx="10" fill="#dbeafe"/><rect x="150" y="31" width="168" height="20" rx="10" fill="#2563eb"/>
      <text class="t" x="0" y="90">Collaborative</text><rect x="150" y="76" width="245" height="20" rx="10" fill="#ede9fe"/><rect x="150" y="76" width="182" height="20" rx="10" fill="#7c3aed"/>
      <text class="t" x="0" y="135">Diversity rerank</text><rect x="150" y="121" width="245" height="20" rx="10" fill="#dcfce7"/><rect x="150" y="121" width="216" height="20" rx="10" fill="#16a34a"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="575" y="240" width="470" height="250" rx="24" fill="#fff"/>
    <text class="h" x="604" y="278">Exposure fairness and explanation audit</text>
    <g transform="translate(615 318)">
      <circle cx="42" cy="42" r="34" fill="#22d3ee" opacity=".85"/><text x="42" y="48" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">A</text>
      <circle cx="155" cy="42" r="28" fill="#a78bfa" opacity=".85"/><text x="155" y="48" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">B</text>
      <circle cx="257" cy="42" r="21" fill="#f472b6" opacity=".85"/><text x="257" y="48" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">C</text>
      <line x1="78" y1="42" x2="125" y2="42" stroke="#94a3b8" stroke-width="3"/><line x1="184" y1="42" x2="234" y2="42" stroke="#94a3b8" stroke-width="3"/>
      <text class="t" x="0" y="115">Fairness warning: provider group C under-exposed</text>
      <text class="t" x="0" y="145">Explanation: recommended due to topic match + diversity rerank</text>
      <text class="t" x="0" y="175">Action: compare relevance loss before deployment decision</text>
    </g>
  </g>
  <text class="t" x="550" y="528" text-anchor="middle">Synthetic preview only • no real users, creators, items, or platform decisions</text>
</svg>