<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Explainable Recommender Fairness Lab banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <radialGradient id="pink" cx="85%" cy="14%" r="72%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="12%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .title{font:800 50px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-1.2px}
      .sub{font:700 23px Arial,Helvetica,sans-serif;fill:#f0abfc}
      .small{font:500 16px Arial,Helvetica,sans-serif;fill:#cbd5e1}
      .chip{font:700 15px Arial,Helvetica,sans-serif;fill:#ecfeff}
      .tiny{font:500 13px Arial,Helvetica,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#cyan)"/>
  <rect width="1200" height="360" rx="30" fill="url(#pink)"/>
  <g opacity=".15" stroke="#e0f2fe" stroke-width="1.2" fill="none">
    <path d="M65 278 C205 174 330 306 470 210 S720 76 910 150 S1055 262 1150 105"/>
    <path d="M70 83 C220 26 322 152 495 97 S750 44 890 104 S1058 210 1144 170"/>
    <path d="M118 309 L298 210 L475 272 L642 145 L842 220 L1090 102"/>
    <path d="M115 62 L300 146 L506 76 L706 178 L936 82 L1115 170"/>
  </g>
  <g opacity=".45">
    <circle cx="115" cy="62" r="5" fill="#22d3ee"/><circle cx="300" cy="146" r="5" fill="#a78bfa"/>
    <circle cx="506" cy="76" r="5" fill="#f472b6"/><circle cx="706" cy="178" r="5" fill="#22c55e"/>
    <circle cx="936" cy="82" r="5" fill="#f59e0b"/><circle cx="1115" cy="170" r="5" fill="#67e8f9"/>
  </g>
  <g transform="translate(66 70)">
    <text class="title" x="0" y="54">Explainable Recommender</text>
    <text class="title" x="0" y="110">Fairness Lab</text>
    <text class="sub" x="0" y="151">Transparent recommendations • exposure fairness • filter-bubble audits</text>
    <text class="small" x="0" y="188">Synthetic users and items • auditable explanations • responsible personalization research</text>
    <g transform="translate(0 225)">
      <rect x="0" y="0" width="126" height="34" rx="17" fill="#7c3aed" opacity=".9"/>
      <text class="chip" x="63" y="23" text-anchor="middle">Explainability</text>
      <rect x="142" y="0" width="144" height="34" rx="17" fill="#0e7490" opacity=".9"/>
      <text class="chip" x="214" y="23" text-anchor="middle">Exposure Fairness</text>
      <rect x="302" y="0" width="126" height="34" rx="17" fill="#be123c" opacity=".9"/>
      <text class="chip" x="365" y="23" text-anchor="middle">Filter Bubbles</text>
      <rect x="444" y="0" width="118" height="34" rx="17" fill="#047857" opacity=".9"/>
      <text class="chip" x="503" y="23" text-anchor="middle">Diversity</text>
    </g>
    <text class="tiny" x="0" y="306">Built for research, auditing, and responsible recommendation-system experimentation.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(842 74)">
    <rect x="0" y="0" width="268" height="205" rx="30" fill="#020617" opacity=".62" stroke="#334155"/>
    <g transform="translate(38 36)">
      <circle cx="46" cy="46" r="30" fill="#22d3ee" opacity=".9"/>
      <circle cx="148" cy="46" r="30" fill="#f472b6" opacity=".9"/>
      <circle cx="96" cy="118" r="30" fill="#a78bfa" opacity=".9"/>
      <line x1="70" y1="56" x2="123" y2="56" stroke="#e2e8f0" stroke-width="4" opacity=".65"/>
      <line x1="58" y1="72" x2="83" y2="98" stroke="#e2e8f0" stroke-width="4" opacity=".65"/>
      <line x1="137" y1="72" x2="109" y2="98" stroke="#e2e8f0" stroke-width="4" opacity=".65"/>
      <text x="96" y="167" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#e2e8f0">Fair ranking graph</text>
    </g>
  </g>
</svg>
